version: 2
unit_tests:
- name: staging_amount_boundaries_and_cleanup
  model: stg_transactions
  description: Границы сегментов, очистка строк и ISO день недели.
  given:
  - input: source('raw', 'transactions')
    rows:
    - transaction_id: '0'
      transaction_time: '2020-01-06 02:00:00'
      merch: ' shop '
      cat_id: ' grocery '
      amount: 99.99
      name_1: Jane
      name_2: Doe
      gender: f
      us_state: ' tx '
      lat: 40
      lon: -70
      merchant_lat: 40.1
      merchant_lon: -70.1
      target: 0
    - transaction_id: '1'
      transaction_time: '2020-01-06 02:00:00'
      merch: ' shop '
      cat_id: ' grocery '
      amount: 100
      name_1: Jane
      name_2: Doe
      gender: f
      us_state: ' tx '
      lat: 40
      lon: -70
      merchant_lat: 40.1
      merchant_lon: -70.1
      target: 1
    - transaction_id: '2'
      transaction_time: '2020-01-06 02:00:00'
      merch: ' shop '
      cat_id: ' grocery '
      amount: 999.99
      name_1: Jane
      name_2: Doe
      gender: f
      us_state: ' tx '
      lat: 40
      lon: -70
      merchant_lat: 40.1
      merchant_lon: -70.1
      target: 0
    - transaction_id: '3'
      transaction_time: '2020-01-06 02:00:00'
      merch: ' shop '
      cat_id: ' grocery '
      amount: 1000
      name_1: Jane
      name_2: Doe
      gender: f
      us_state: ' tx '
      lat: 40
      lon: -70
      merchant_lat: 40.1
      merchant_lon: -70.1
      target: 1
  expect:
    rows:
    - transaction_id: '0'
      amount_segment: SMALL
      day_of_week: 1
      transaction_hour: 2
      us_state: TX
      fraud_flag: 0
    - transaction_id: '1'
      amount_segment: MEDIUM
      day_of_week: 1
      transaction_hour: 2
      us_state: TX
      fraud_flag: 1
    - transaction_id: '2'
      amount_segment: MEDIUM
      day_of_week: 1
      transaction_hour: 2
      us_state: TX
      fraud_flag: 0
    - transaction_id: '3'
      amount_segment: LARGE
      day_of_week: 1
      transaction_hour: 2
      us_state: TX
      fraud_flag: 1
