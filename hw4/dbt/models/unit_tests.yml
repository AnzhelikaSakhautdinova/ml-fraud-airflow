- name: daily_p95_nearest_rank
  model: mart_daily_state_metrics
  description: Точный nearest-rank P95 и сумма на короткой выборке.
  given:
  - input: ref('stg_transactions')
    rows:
    - transaction_date: '2020-01-01'
      us_state: TX
      amount: 10
      amount_segment: SMALL
    - transaction_date: '2020-01-01'
      us_state: TX
      amount: 20
      amount_segment: SMALL
    - transaction_date: '2020-01-01'
      us_state: TX
      amount: 1000
      amount_segment: LARGE
  expect:
    rows:
    - transaction_date: '2020-01-01'
      us_state: TX
      transaction_count: 3
      total_amount: 1030
      p95_amount: 1000
